name: Build OrangeFox TB375FC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 发布 Release 要写权限；仓库默认 workflow 权限若被设成 read，这一步会 403。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'optional: tag to publish a pre-release'
        required: false
        default: ''
  # Full builds are manual-only on purpose: fox_16.0 Sync needs ~85 GB and a
  # GitHub-hosted runner has ~40 GB, so a push must not burn a run on it.
  # Push-triggered jobs live in validate.yml instead.

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/lenovo/tb375fc

      - name: Compute build metadata
        # 时间戳只算一次，镜像文件名与 Release 的 tag/正文共用同一个值，
        # 免得两边差几秒对不上。
        id: meta
        run: |
          TS=$(date -u +%Y%m%d_%H%M%S)
          SHA7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "ts=$TS"     >> "$GITHUB_OUTPUT"
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"
          echo "timestamp ${TS} sha7 ${SHA7}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost
          sudo rm -rf /opt/az /opt/microsoft /usr/share/swift /usr/local/share/chromium
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Set up swap and zram
        run: |
          # Run #20 (2026-11-26) OOM: soong_build anon-rss 13.4 GiB, 20 GiB swapfile
          # 100 % consumed (`Free swap = 0kB`), cgroup killed it -> exit 143.
          # 磁盘只剩 ~40 GiB（repo sync 要 85+ GiB），不能再加大 swapfile，
          # 所以用 zram（压缩内存，不落地磁盘）兜住解析 Android.bp 的峰值。
          free -h
          sudo modprobe zram || true
          if [ -b /dev/zram0 ]; then
            sudo swapoff /dev/zram0 || true
            # 顺序不能反：先选压缩算法，再写 disksize（写完后 sysfs 不能再改算法）
            echo zstd | sudo tee /sys/block/zram0/comp_algorithm >/dev/null 2>&1 || true
            echo 12G  | sudo tee /sys/block/zram0/disksize        >/dev/null 2>&1 || true
            sudo mkswap /dev/zram0 || true
            sudo swapon -p 100 /dev/zram0 || true
            echo "zram: $(cat /sys/block/zram0/disksize 2>/dev/null) B, algo=$(cat /sys/block/zram0/comp_algorithm 2>/dev/null)"
          else
            echo "zram module unavailable, relying on the swapfile only"
          fi
          SWAP_KB=$(awk '/^SwapTotal/ {print $2}' /proc/meminfo)
          echo "swap+zram total: ${SWAP_KB:-0} kB"
          if [ "${SWAP_KB:-0}" -lt 28000000 ]; then
            sudo rm -f /swapfile || true
            sudo fallocate -l 20G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=20480 status=none || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon -p 10 /swapfile || true
          fi
          free -h
          df -h /
          exit 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 ccache
          # scripts/splice_platform.py 需要 lz4（recovery 分片重编码成 lz4 legacy，MTK LK 只认 lz4）
            # zstandard 只用来解码旧包里的 0000+zstd 零件
          python3 -m pip install --user lz4 zstandard
          df -h /

      - name: Configure git
        run: |
          git config --global user.name  "CI"
          git config --global user.email "ci@localhost"
          git config --global url."https://github.com/".insteadOf "https://github.com/"
          df -h /

      - name: Repo init (fox_16.0)
        run: |
          mkdir -p ${{ github.workspace }}/fox
          cd ${{ github.workspace }}/fox
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          sudo install -m 755 /tmp/repo /usr/local/bin/repo
          repo init --depth=1 --no-clone-bundle --no-tags \
            -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          df -h /

      - name: Repo sync
        run: |
          cd ${{ github.workspace }}/fox
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags --quiet
          df -h /

      - name: Drop .repo to free disk
        run: |
          # fox_16.0 checks out ~85 GB, and the vendor_boot build then writes
          # 30-40 GB of out/. Runs #5 and #6 both died silent in the middle of
          # `mka` (no log was ever uploaded), which on a 146 GB runner points at
          # the disk filling up. Nothing after this step needs repo metadata, so
          # drop it and hand the space to out/.
          cd ${{ github.workspace }}/fox
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          rm -rf out/.repo* 2>/dev/null || true
          df -h /
          echo "free space above is what out/ has to live in"

      - name: Place device tree
        run: |
          rm -rf ${{ github.workspace }}/fox/device/lenovo/tb375fc
          mkdir -p ${{ github.workspace }}/fox/device/lenovo
          cp -a ${{ github.workspace }}/device/lenovo/tb375fc ${{ github.workspace }}/fox/device/lenovo/tb375fc
          ls -la ${{ github.workspace }}/fox/device/lenovo/tb375fc
          find ${{ github.workspace }}/fox/device/lenovo/tb375fc -name '*.ko' | wc -l

      - name: Build vendorbootimage
        id: build
        run: |
          cd ${{ github.workspace }}/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # The runner's 15 GB cgroup OOM-kills soong_build (13.4 GB anon-rss,
          # see the TERM trap dmesg in the TWRP repo) while it parses Android.bp;
          # the kill surfaces as "runner lost communication". soong_build is Go,
          # so bound its heap and make the GC work harder.
          export GOMEMLIMIT=8GiB
          export GOGC=25
          source build/envsetup.sh
          . device/lenovo/tb375fc/vendorsetup.sh
          lunch twrp_tb375fc-bp2a-eng
          # TARGET_NO_KERNEL=true means AOSP never creates out/.../root (it only
          # appears as a side effect of the boot ramdisk rule), and the recovery
          # ramdisk rule rsyncs from $OUT/root -- losing that race kills the build
          # with: rsync: link_stat ".../tb375fc/root" failed: No such file or
          # directory. Pre-create both staging dirs so it is deterministic.
          mkdir -p "$OUT/root" "$OUT/vendor_ramdisk"
          # run#15（2026-11-26）实测：recovery ramdisk 规则里 OrangeFox 的
          # Fox_Before_Recovery_Image 钩子在「cp -rf device/.../recovery/root」之前就跑，
          # 它要往 $TARGET_RECOVERY_ROOT_OUT/sbin 写 magiskboot、往 linkerconfig 写
          # ld.config.txt。MOVE 模式下 recovery root 只是从空的 $OUT/root rsync 出来的，
          # 没有 sbin/、没有 linkerconfig/，于是：
          #   /bin/cp: cannot create .../recovery/root//sbin/magiskboot: No such file
          #   touch: '.../recovery/root/linkerconfig/ld.config.txt': No such file
          #   ninja: build stopped: subcommand failed.
          # 先把本仓库的 recovery/root 预铺进去，并把钩子需要的两个目录建好。
          mkdir -p "$OUT/recovery/root"
          rsync -a "device/lenovo/tb375fc/recovery/root/" "$OUT/recovery/root/"
          mkdir -p "$OUT/recovery/root/sbin" "$OUT/recovery/root/linkerconfig" \
                   "$OUT/recovery/root/system/etc" "$OUT/recovery/root/system/bin"
          ls -d "$OUT/recovery/root/sbin" "$OUT/recovery/root/linkerconfig"
          # Cap the java heap so several javac/metalava workers cannot eat the
          # whole 7 GB runner, and heartbeat the system pressure every 3 min so
          # the next crash still leaves a trail in the step log.
          export _JAVA_OPTIONS="-Xmx3g"
          ( while true; do sleep 180; echo "[heartbeat $(date -u)] freeRoot=$(df -h / | awk 'NR==2{print $4}') mem=$(free -m | awk '/^Mem:/{print $3"/"$2"MB"}') swap=$(free -m | awk '/^Swap:/{print $3"/"$2"MB"}')"; done ) &
          HB=$!
          trap 'echo "== trapped TERM/INT =="; free -h || true; df -h / || true; (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | tail -80 || true; exit 143' TERM INT
          set -o pipefail
          set +e
          # -j2 instead of -j4: halve the peak memory of the ninja fan-out.
          mka vendorbootimage -j2 2>&1 | tee build.log
          RC=$?
          kill $HB 2>/dev/null || true
          df -h /
          free -h
          OUT=out/target/product/tb375fc
          REC=$(ls "$OUT"/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio* 2>/dev/null | head -n 1)
          DTB="$OUT/dtb.img"
          FBP=device/lenovo/tb375fc/prebuilt/ofox_recovery_ramdisk.zst
          if [ "$RC" -ne 0 ] && [ -f "$DTB" ] && { [ -n "$REC" ] || [ -f "$FBP" ]; }; then
            # run#16（2026-11-26）实测：fox_16.0 的 system/tools/mkbootimg 是旧版，
            # 不认 AOSP 16 Makefile 传的 --ramdisk_type / --ramdisk_name /
            # --vendor_ramdisk_fragment，最后一步必然：
            #   ValueError: Unrecognized arguments: ['--ramdisk_type', 'RECOVERY', ...]
            # 但那一刻 recovery 分片 recovery.cpio.lz4 和 dtb.img 都已经编好了，
            # 所以判定失败但把零件路径吐出去，交给 Splice 步骤直接拼包。
            echo "mkbootimg step failed (old mkbootimg.py, no fragment support) - continuing with parts"
            echo "rec_path=$REC"   >> "$GITHUB_OUTPUT"
            echo "dtb_path=$DTB"   >> "$GITHUB_OUTPUT"
            echo "fallback_path=$FBP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $RC

      - name: Splice official platform ramdisk
        id: splice
        # 两条路径：有 vendor_boot.img 就从镜像里抽 recovery 片；没有就用零件拼
        # （本树 mkbootimg 不支持分片时就是这种）。
        env:
          REC: ${{ steps.build.outputs.rec_path }}
          DTB: ${{ steps.build.outputs.dtb_path }}
          FBP: ${{ steps.build.outputs.fallback_path }}
        run: |
          cd ${{ github.workspace }}/fox
          DEV=device/lenovo/tb375fc
          OUT_IMG=$(find out -maxdepth 4 -name 'vendor_boot.img' -size +1k 2>/dev/null | head -n 1)
          echo "vendor_boot.img: ${OUT_IMG:-<none>}  parts: rec=${REC:-<none>} dtb=${DTB:-<none>}"
          if [ -n "$OUT_IMG" ]; then
            python3 $DEV/scripts/splice_platform.py \
              --input "$OUT_IMG" \
              --platform $DEV/prebuilt/platform_ramdisk.lz4 \
              --fallback-cpio $DEV/prebuilt/ofox_recovery_ramdisk.zst \
              --output ${{ github.workspace }}/vendor_boot_TWRP_64MB.img \
              --size 67108864
          elif [ -f "$DTB" ]; then
            # 编出来的 recovery.cpio 可能只是"壳"（MOVE 模式下缺 system/bin/recovery），
            # 脚本会自检；不完整就换成 prebuilt 里那份已验证能起 recovery 的分片。
            python3 $DEV/scripts/splice_platform.py \
              --recovery-cpio "${REC:-$DEV/prebuilt/ofox_recovery_ramdisk.zst}" \
              --dtb "$DTB" \
              --header $DEV/prebuilt/vendor_boot_header.bin \
              --fallback-cpio $DEV/prebuilt/ofox_recovery_ramdisk.zst \
              --platform $DEV/prebuilt/platform_ramdisk.lz4 \
              --output ${{ github.workspace }}/vendor_boot_TWRP_64MB.img \
              --size 67108864
          else
            echo "既有没 vendor_boot.img 也没有 recovery.cpio 零件，无法拼包"
            exit 1
          fi
          ls -l ${{ github.workspace }}/vendor_boot_TWRP_64MB.img
          md5sum ${{ github.workspace }}/vendor_boot_TWRP_64MB.img
          # 2026-11-26 实机验证能进 recovery 的那一份，md5 固定是下面这个值。
          # 走到 prebuilt 兜底时输出必须和它逐字节一致。
          KNOWN=6f8c9b4ed15585ed04249fc31db424ea
          GOT=$(md5sum ${{ github.workspace }}/vendor_boot_TWRP_64MB.img | cut -d' ' -f1)
          if [ "$GOT" = "$KNOWN" ]; then echo "== 与实测可用包逐字节一致 ($GOT) =="; else echo "== md5 $GOT（与已验证包不同，注意 recovery 分片来源）=="; fi

      - name: Collect outputs with timestamp
        if: always()
        id: collect
        run: |
          TS=${{ steps.meta.outputs.ts }}
          SHA7=${{ steps.meta.outputs.sha7 }}
          mkdir -p out_artifacts
          # 0 字节的 vendor_boot.img 是 mkbootimg 报 ValueError 之前写空的残骸，
          # run#18 就是把它也塞进 Release 才挂的
          #（Validation Failed: ReleaseAsset size must be greater than or equal to 1）。
          for f in $(find "${{ github.workspace }}/fox/out" -name 'vendor_boot*.img' -size +1k 2>/dev/null); do
            cp "$f" "out_artifacts/$(basename "$f" .img)_tb375fc_${TS}_${SHA7}.img"
          done
          if [ -f "${{ github.workspace }}/vendor_boot_TWRP_64MB.img" ]; then
            cp "${{ github.workspace }}/vendor_boot_TWRP_64MB.img" \
               "out_artifacts/vendor_boot_TWRP_64MB_tb375fc_${TS}_${SHA7}.img"
          fi
          for f in $(find "${{ github.workspace }}/fox/out" -name '*vendor_boot*.zip' -size +1k 2>/dev/null); do
            cp "$f" "out_artifacts/$(basename "$f" .zip)_tb375fc_${TS}_${SHA7}.zip"
          done
          printf 'build_utc=%s\ncommit=%s\nrun=%s\n' "${TS}" "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" > out_artifacts/build_info.txt
          echo "timestamp=${TS}" > timestamp.txt
          ls -la out_artifacts || true
          if [ -f "${{ github.workspace }}/fox/build.log" ]; then
            tail -n 200 "${{ github.workspace }}/fox/build.log" > build_tail.log
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb375fc-ofox16-r${{ github.run_number }}
          path: |
            out_artifacts/**
            build_tail.log
          if-no-files-found: warn

      - name: Publish pre-release
        # 每次成功编出 img 都直接发到 Releases（不必再进 Actions 翻 artifact）。
        # tag/标题都带构建时算出的 UTC 时间戳，和镜像是同一个值：
        #   tag  = ofox-tb375fc-20261126_103012
        # 手动 dispatch 时若填了 release_tag，就用填的那个。
        if: success() && hashFiles('out_artifacts/**/*.img') != ''
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('ofox-tb375fc-{0}', steps.meta.outputs.ts) }}
          name: OrangeFox TB375FC ${{ steps.meta.outputs.ts }} (r${{ github.run_number }})
          body: |
            OrangeFox TB375FC 两片 vendor_boot

            | 项 | 值 |
            |---|---|
            | 时间戳 (UTC) | `${{ steps.meta.outputs.ts }}` |
            | 提交 | `${{ github.sha }}` |
            | run | #${{ github.run_number }} |
            | 结构 | platform(type=1，官方 6.1.138 模块) + recovery(type=2，OrangeFox 根文件系统) |
            | 大小 | 67,108,864 B (64 MiB) |

            刷入：
            ```
            adb reboot bootloader
            fastboot flash vendor_boot <img>
            fastboot reboot recovery
            ```
            回滚：刷回官方 `vendor_boot.img`（vrs 26,902,388，md5 E60D9F853E08CDE9D099EA1143D760F8）。
            本包未做实机验证，第一次刷入请备好官方原片。
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            out_artifacts/*.img
            out_artifacts/build_info.txt
          token: ${{ secrets.GITHUB_TOKEN }}


name: Build OrangeFox TB375FC

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'optional: tag to publish a pre-release'
        required: false
        default: ''
  push:
    branches: [ main, fox_16.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/lenovo/tb375fc

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 ccache
          df -h /

      - name: Configure git
        run: |
          git config --global user.name  "CI"
          git config --global user.email "ci@localhost"
          git config --global url."https://github.com/".insteadOf "https://github.com/"
          df -h /

      - name: Repo init (fox_16.0)
        run: |
          mkdir -p ${{ github.workspace }}/fox
          cd ${{ github.workspace }}/fox
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          sudo install -m 755 /tmp/repo /usr/local/bin/repo
          repo init --depth=1 --no-clone-bundle --no-tags \
            -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          df -h /

      - name: Repo sync
        run: |
          cd ${{ github.workspace }}/fox
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags --quiet
          df -h /

      - name: Place device tree
        run: |
          rm -rf ${{ github.workspace }}/fox/device/lenovo/tb375fc
          mkdir -p ${{ github.workspace }}/fox/device/lenovo
          cp -a ${{ github.workspace }}/device/lenovo/tb375fc ${{ github.workspace }}/fox/device/lenovo/tb375fc
          ls -la ${{ github.workspace }}/fox/device/lenovo/tb375fc
          find ${{ github.workspace }}/fox/device/lenovo/tb375fc -name '*.ko' | wc -l

      - name: Build vendorbootimage
        run: |
          cd ${{ github.workspace }}/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          . device/lenovo/tb375fc/vendorsetup.sh
          lunch twrp_tb375fc-bp2a-eng
          mka vendorbootimage -j"$(nproc --all)" 2>&1 | tee build.log
          df -h /

      - name: Collect outputs with timestamp
        if: always()
        run: |
          TS=$(date -u +%Y%m%d_%H%M%S)
          SHA7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          mkdir -p out_artifacts
          for f in $(find "${{ github.workspace }}/fox/out" -name 'vendor_boot*.img' 2>/dev/null); do
            cp "$f" "out_artifacts/$(basename "$f" .img)_tb375fc_${TS}_${SHA7}.img"
          done
          for f in $(find "${{ github.workspace }}/fox/out" -name '*vendor_boot*.zip' 2>/dev/null); do
            cp "$f" "out_artifacts/$(basename "$f" .zip)_tb375fc_${TS}_${SHA7}.zip"
          done
          printf 'build_utc=%s\ncommit=%s\nrun=%s\n' "${TS}" "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" > out_artifacts/build_info.txt
          echo "timestamp=${TS}" > timestamp.txt
          ls -la out_artifacts || true
          if [ -f "${{ github.workspace }}/fox/build.log" ]; then
            tail -n 200 "${{ github.workspace }}/fox/build.log" > build_tail.log
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb375fc-ofox16-r${{ github.run_number }}
          path: |
            out_artifacts/**
            build_tail.log
          if-no-files-found: warn

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: OrangeFox ${{ github.event.inputs.release_tag }}
          prerelease: true
          files: out_artifacts/**
          token: ${{ secrets.GITHUB_TOKEN }}
